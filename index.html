<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafariDoku – Le puzzle logique des animaux</title>
<meta name="description" content="Un animal par ligne, par colonne et par enclos : un jeu de logique pour iPhone, avec seize îles à traverser.">
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<style>
  @font-face { font-family: Besley; src: url(fonts/Besley.ttf); font-weight: 400 900; font-display: swap; }
  @font-face { font-family: Cabin; src: url(fonts/Cabin.ttf); font-weight: 400 700; font-display: swap; }
  :root { color-scheme: light; --ink: #2A2620; --paper: #F4EDE0; --deep: #EADFCB; --coral: #C4532F; --green: #2A7561; --soft: #5f5a52; }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(var(--paper), var(--deep)) fixed; color: var(--ink); font: 18px/1.6 Cabin, system-ui, sans-serif; }
  main { max-width: 42em; margin: 0 auto; padding: 44px 20px 72px; }
  h1 { font: 900 clamp(30px, 6vw, 44px)/1.1 Besley, Georgia, serif; letter-spacing: -0.01em; margin: 0 0 10px; text-wrap: balance; }
  h1 span, .brand span { color: var(--coral); }
  p { margin: 0 0 18px; }
  .lede { color: var(--soft); margin-bottom: 30px; }
  a { color: var(--green); text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 4px; }
  ::selection { background: #f0c9b8; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font: 900 20px Besley, Georgia, serif; color: var(--ink); text-decoration: none; margin-bottom: 36px; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 3px 8px rgba(42, 38, 32, .22); }
  footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid rgba(42, 38, 32, .14); font-size: 16px; color: var(--soft); display: flex; gap: 18px; flex-wrap: wrap; }
  .hero { text-align: center; padding-top: 8px; }
  .hero > img { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 2px 3px rgba(42, 38, 32, .14), 0 18px 36px rgba(42, 38, 32, .2); }
  .hero h1 { font-size: clamp(44px, 11vw, 72px); margin: 26px 0 8px; }
  .hero .voice { font: italic 500 clamp(19px, 4.4vw, 24px) Besley, Georgia, serif; color: var(--soft); margin-bottom: 20px; }
  .hero .pitch { max-width: 31em; margin: 0 auto 8px; }
  .soon { display: inline-block; margin: 18px 0 6px; padding: 12px 22px; border-radius: 16px; background: var(--ink); color: #FFFDF8; font: 700 18px Besley, Georgia, serif; box-shadow: 0 5px 0 #14110d, 0 12px 18px rgba(42, 38, 32, .22); }
  .shots { display: grid; grid-auto-flow: column; grid-auto-columns: min(64vw, 270px); gap: 18px; overflow-x: auto; padding: 34px 20px 26px; margin: 26px -20px 0; scroll-snap-type: x mandatory; }
  .shots img { width: 100%; height: auto; border-radius: 22px; scroll-snap-align: center; box-shadow: 0 2px 3px rgba(42, 38, 32, .12), 0 14px 28px rgba(42, 38, 32, .18); }
  @media (min-width: 1000px) { .wide { max-width: 1040px; } .shots { grid-auto-columns: 1fr; overflow: visible; margin: 26px 0 0; padding-inline: 0; } }
</style>
</head>
<body>
<main class="wide">
<div class="hero">
<img src="img/icon.png" alt="Icône de SafariDoku : un lion, un zèbre, un éléphant et une girafe">
<h1>Safari<span>Doku</span></h1>
<p class="voice">Chaque animal dans son enclos.</p>
<p class="pitch">Un jeu de logique pour iPhone : un animal par ligne, par colonne et par enclos, jamais côte à côte. Des grilles à solution unique, seize îles à traverser et un défi nouveau chaque jour.</p>
<span class="soon">Bientôt sur l'App Store</span>
</div>
<div class="shots">
<img src="img/1-jeu.jpg" alt="Un animal par ligne, par colonne, par enclos" width="660" height="1434" loading="lazy">
<img src="img/2-iles.jpg" alt="16 îles à explorer" width="660" height="1434" loading="lazy">
<img src="img/4-carte.jpg" alt="Un défi chaque jour" width="660" height="1434" loading="lazy">
<img src="img/5-zoo.jpg" alt="Adopte-les tous" width="660" height="1434" loading="lazy">
</div>
<footer>
<a href="./">SafariDoku</a>
<a href="assistance.html">Assistance</a>
<a href="confidentialite.html">Confidentialité</a>
<a href="https://nohdev.github.io/">NohDev</a>
</footer>
</main>
</body>
</html>
